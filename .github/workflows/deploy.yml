name: Deploy

# Runs when a release tag (v1.2.3) is pushed, or manually from the Actions tab ("Run workflow").
# Pushes to branches never deploy.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to Google (no stored keys)

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: devops-playground-14386
  REGION: northamerica-northeast1
  SERVICE: shipit

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      # A tag must match the version in package.json, so the site never shows a wrong version.
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Runtime settings live here, so every release applies the same configuration.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --service-account "shipit-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --max-instances 3 \
            --memory 256Mi \
            --cpu 1 \
            --concurrency 80 \
            --timeout 60 \
            --liveness-probe httpGet.path=/health,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3 \
            --remove-env-vars PREVIEW_PR \
            --quiet

      # PR previews deploy with --no-traffic, which pins traffic to a fixed revision.
      # Production must explicitly send 100% to the revision it just deployed.
      - name: Send all traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-latest \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/health"
          echo
          curl -fsS "$URL/api/info"
