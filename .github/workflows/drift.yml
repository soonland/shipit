name: Drift check

# Every night, compare Google Cloud with the Terraform code (main stack).
# If someone changed something by hand (console, gcloud), open a GitHub issue
# labelled "drift" (GitHub emails you); close it once everything matches again.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 4–5 a.m. in Montréal
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless sign-in to Google
  issues: write # open / update / close the drift issue

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      # Same read-only identity as the PR plan: it can look, never change.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Init
        run: terraform init

      # Exit code: 0 = matches, 2 = drift, 1 = error.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]

      - name: Open, update or close the drift issue
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v9
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const code = process.env.EXIT_CODE;
            const label = 'drift';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.getLabel({ owner, repo, name: label }).catch(() =>
              github.rest.issues.createLabel({ owner, repo, name: label, color: 'c040ff',
                description: 'Google Cloud differs from the Terraform code' }));

            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open' })).data[0];

            if (code === '0') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number,
                  body: `✅ No drift anymore ([run](${run})). Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }

            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n… (truncated, see the run)';
            const what = code === '2'
              ? 'Google Cloud no longer matches the Terraform code. Either revert the manual change, or apply (Actions → Terraform → Run workflow) to put it back as coded.'
              : 'The nightly plan failed, so drift could not be checked.';
            const body = `${what}\n\n[Run](${run})\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            if (open) await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            else await github.rest.issues.create({ owner, repo, labels: [label],
              title: code === '2' ? 'Infrastructure drift detected' : 'Drift check failed', body });
