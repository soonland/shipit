name: Terraform

# plan: on every PR that touches the infrastructure; the plan is posted as a PR comment.
# apply: only when you click "Run workflow" on main (re-plans first, then applies that plan).
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'monitoring/dashboard.json'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless sign-in to Google
  pull-requests: write # plan comment

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read-only identity: can read monitoring and the state, cannot change anything.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate -no-color

      # -lock=false: the plan identity can only read the state bucket.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]

      - name: Comment plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.existsSync('infra/plan.txt') ? fs.readFileSync('infra/plan.txt', 'utf8') : 'No plan output.';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n… (truncated, see the workflow log)';
            const code = process.env.EXIT_CODE;
            const summary = code === '0' ? '✅ **No changes.**'
              : code === '2' ? '📝 **Changes to apply** after merge (Actions → Terraform → Run workflow).'
              : '❌ **Plan failed.**';
            const body = `${marker}\n### Terraform plan\n${summary}\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Run ${context.runId} · ${context.sha.slice(0, 7)}_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infrastructure
    steps:
      - uses: actions/checkout@v7

      # Write identity: Google only lets workflows on main use it.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        run: terraform apply -no-color tfplan
